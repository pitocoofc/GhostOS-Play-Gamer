<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Loja de Jogos</title>
<style>
:root{--bg:#101314;--sf:#1a1e20;--sf2:#252a2c;--ln:#ffffff14;--tx:#e3e8e6;--mu:#9aa5a1;--gr:#01a672;--gd:#01875f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{font-family:"Google Sans",Roboto,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
::-webkit-scrollbar{display:none}
#app{height:100dvh;display:flex;flex-direction:column}
header{padding:calc(10px + env(safe-area-inset-top)) 14px 0;background:var(--bg);flex-shrink:0}
.sbar{display:flex;align-items:center;gap:10px;background:var(--sf2);border-radius:28px;padding:6px 8px 6px 16px;height:50px}
.sbar input{flex:1;min-width:0;background:0;border:0;outline:0;color:var(--tx);font-size:15px;user-select:text}
.sbar input::placeholder{color:var(--mu)}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899);display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 10px}
.chip{flex-shrink:0;padding:8px 16px;border-radius:10px;border:1px solid #ffffff24;color:var(--tx);font-size:13px;font-weight:500;background:0;cursor:pointer}
.chip.on{background:#01a67226;border-color:var(--gr);color:#6ee7b7}
main{flex:1;overflow-y:auto;padding-bottom:96px}
h2{font-size:17px;font-weight:600;padding:20px 16px 10px}
.hero{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 16px}
.hc{flex:0 0 86%;height:178px;border-radius:18px;padding:16px;position:relative;overflow:hidden;scroll-snap-align:center;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;cursor:pointer}
.hc .big{position:absolute;right:-6px;top:6px;font-size:96px;opacity:.9;filter:drop-shadow(0 8px 12px #0006)}
.hc .tag{position:absolute;left:16px;top:14px;font-size:11px;font-weight:600;background:#00000059;padding:4px 10px;border-radius:20px}
.hc b{font-size:20px;text-shadow:0 2px 8px #0005}
.hc span.m{font-size:12px;opacity:.9;margin-bottom:8px}
.row{display:flex;gap:14px;overflow-x:auto;padding:0 16px}
.rc{flex:0 0 96px;cursor:pointer}
.rc:active,.li:active{opacity:.7}
.ic{width:100%;aspect-ratio:1;border-radius:22%;display:grid;place-items:center;font-size:40px;box-shadow:0 4px 12px #0006,inset 0 1px 1px #ffffff40}
.rc b{display:block;font-size:13px;font-weight:500;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc span,.li span{font-size:12px;color:var(--mu);display:block;margin-top:1px}
.li{display:flex;align-items:center;gap:14px;padding:10px 16px;cursor:pointer}
.li .ic{width:60px;font-size:30px;flex-shrink:0}
.li .inf{flex:1;min-width:0}
.li b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li em{font-style:normal;width:18px;color:var(--mu);font-size:14px;text-align:center}
.btn{border:0;background:var(--gr);color:#00180f;font:600 13px inherit;font-family:inherit;padding:9px 18px;border-radius:20px;cursor:pointer;min-width:84px;flex-shrink:0}
.btn.op{background:0;border:1px solid #ffffff3d;color:#6ee7b7}
.btn.prog{background:linear-gradient(90deg,var(--gd) var(--p),var(--sf2) var(--p));color:#fff;border:0}
.btn.big{width:100%;padding:13px;font-size:15px;border-radius:24px}
.btn.sec{background:0;border:1px solid #ffffff3d;color:var(--tx)}
.empty{text-align:center;color:var(--mu);padding:60px 30px;font-size:14px;line-height:1.6}
nav.bn{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#181c1e;border-top:1px solid var(--ln);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:20}
.bn button{background:0;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font:500 11px inherit;font-family:inherit;cursor:pointer;flex:1}
.bn span{width:58px;height:30px;border-radius:16px;display:grid;place-items:center;font-size:18px;transition:background .2s}
.bn button.on{color:var(--tx)}
.bn button.on span{background:#01a67233}
#detail{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:30px}
#detail.open{transform:none}
.dh{position:sticky;top:0;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:var(--bg);z-index:2}
.back{width:44px;height:44px;border-radius:50%;border:0;background:0;color:var(--tx);font-size:22px;cursor:pointer}
.dt{display:flex;gap:16px;padding:6px 16px 0}
.dt .ic{width:88px;font-size:44px;flex-shrink:0}
.dt h1{font-size:22px;font-weight:600;line-height:1.2}
.dt p{font-size:13px;margin-top:3px;color:var(--mu)}
.dt p.dv{color:#6ee7b7;font-weight:500}
.st{display:flex;margin:20px 0 4px;padding:0 6px}
.st div{flex:1;text-align:center;padding:2px 4px;border-right:1px solid var(--ln)}
.st div:last-child{border:0}
.st b{display:block;font-size:14px;font-weight:600}
.st span{font-size:11px;color:var(--mu)}
.acts{padding:14px 16px 0;display:flex;flex-direction:column;gap:10px}
.shots{display:flex;gap:10px;overflow-x:auto;padding:0 16px}
.sh{flex:0 0 130px;height:230px;border-radius:14px;display:grid;place-items:center;font-size:54px;position:relative;overflow:hidden}
.sh i{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-style:normal;font-size:11px;opacity:.8}
.dsc{padding:0 16px;font-size:14px;line-height:1.6;color:#c7d0cc}
.rt{display:flex;gap:20px;align-items:center;padding:0 16px}
.rt .n{font-size:46px;font-weight:300;line-height:1}
.rt .n small{display:block;font-size:11px;color:var(--mu);font-weight:400;margin-top:6px}
.bars{flex:1;display:flex;flex-direction:column;gap:5px}
.bars div{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mu)}
.bars i{flex:1;height:6px;border-radius:3px;background:var(--sf2);overflow:hidden}
.bars u{display:block;height:100%;background:var(--gr)}
#player{position:fixed;inset:0;background:#000;z-index:100;display:none}
#player.on{display:block}
#player iframe{width:100%;height:100%;border:0}
.cx{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:40px;height:40px;border-radius:50%;border:1px solid #fff3;background:#0f172ab3;color:#fff;font-size:22px;z-index:101;cursor:pointer;backdrop-filter:blur(8px)}
.cx:active{background:#ef4444}
#snack{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));background:#e3e8e6;color:#101314;padding:13px 16px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none}
#snack.on{opacity:1;transform:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="sbar"><span>🔍</span><input id="q" placeholder="Pesquisar jogos" autocomplete="off"><div class="av">G</div></div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="view"></main>
  <nav class="bn">
    <button data-t="home" class="on"><span>🎮</span>Jogos</button>
    <button data-t="search"><span>🔍</span>Pesquisar</button>
    <button data-t="lib"><span>📚</span>Biblioteca</button>
  </nav>
</div>
<div id="detail"></div>
<div id="player"><button class="cx" id="cx">&times;</button><iframe id="fr" src=""></iframe></div>
<div id="snack"></div>

<script>
const $=id=>document.getElementById(id);
const games=[
 {id:'ritmo',name:'Ritmo Neon',file:'jogos/ritmo-neon.html',icon:'🎵',cat:'Arcade',rate:4.7,size:'3,2 MB',dl:'50 mil+',c:['#7c3aed','#ec4899'],tag:'Em alta',desc:'Acompanhe a batida e toque no tempo certo. Cada acerto acende a pista em neon e aumenta o combo. Quanto mais longe você chega, mais rápido o ritmo fica.'},
 {id:'pulo',name:'Pulo Duplo',file:'jogos/pulo-duplo.html',icon:'🦘',cat:'Arcade',rate:4.5,size:'2,8 MB',dl:'20 mil+',c:['#16a34a','#84cc16'],tag:'Novo',desc:'Salte, salte de novo e desvie dos obstáculos. O segundo pulo no ar é o segredo para alcançar as plataformas mais altas.'},
 {id:'desvie',name:'Desvie',file:'jogos/desvie.html',icon:'☄️',cat:'Arcade',rate:4.3,size:'1,9 MB',dl:'10 mil+',c:['#ef4444','#f97316'],tag:'Reflexos',desc:'Objetos caem de todos os lados. Deslize o dedo para escapar e sobreviva o máximo que conseguir.'},
 {id:'velha',name:'Jogo da Velha',file:'jogos/velha/velha.html',icon:'❌',cat:'Puzzle',rate:4.6,size:'0,8 MB',dl:'100 mil+',c:['#0ea5e9','#6366f1'],tag:'Clássico',desc:'O clássico de três em linha, para jogar com um amigo no mesmo aparelho. Partidas rápidas, sem cadastro.'},
 {id:'click',name:'Corrida',file:'jogos/click.html',icon:'👆',cat:'Casual',rate:4.2,size:'1,1 MB',dl:'5 mil+',c:['#f59e0b','#ef4444'],tag:'Casual',desc:'Toque o mais rápido que puder para chegar na frente. Simples de aprender e difícil de largar.'},
 {id:'memoria',name:'Memória',file:'memoria.html',icon:'🧠',cat:'Puzzle',rate:4.4,size:'1,4 MB',dl:'20 mil+',c:['#14b8a6','#3b82f6'],tag:'Cérebro',desc:'Vire as cartas, encontre os pares e treine a memória. Os níveis ficam maiores a cada vitória.'}
];
const cats=['Para você','Arcade','Puzzle','Casual'];
let tab='home',cat='Para você',cur=null,busy={},inst=new Set();
try{inst=new Set(JSON.parse(localStorage.getItem('hub_installed')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('hub_installed',JSON.stringify([...inst]))}catch(e){}};
const fm=r=>r.toFixed(1).replace('.',',');
const bg=g=>`background:linear-gradient(135deg,${g.c[0]},${g.c[1]})`;
const by=id=>games.find(g=>g.id===id);
const btn=(g,x='')=>`<button class="btn ${inst.has(g.id)?'op':''} ${x}" data-id="${g.id}">${inst.has(g.id)?'Abrir':'Instalar'}</button>`;

const hero=g=>`<div class="hc" style="${bg(g)}" data-open="${g.id}"><span class="tag">${g.tag}</span><span class="big">${g.icon}</span><b>${g.name}</b><span class="m">${g.cat} · ${fm(g.rate)} ★</span><div>${btn(g)}</div></div>`;
const rc=g=>`<div class="rc" data-open="${g.id}"><div class="ic" style="${bg(g)}">${g.icon}</div><b>${g.name}</b><span>${g.cat} · ${fm(g.rate)} ★</span></div>`;
const li=(g,n)=>`<div class="li" data-open="${g.id}">${n?`<em>${n}</em>`:''}<div class="ic" style="${bg(g)}">${g.icon}</div><div class="inf"><b>${g.name}</b><span>${g.cat} · ${g.size}</span><span>${fm(g.rate)} ★ · ${g.dl} downloads</span></div>${btn(g)}</div>`;
const list=(a,rank)=>a.map((g,i)=>li(g,rank?i+1:0)).join('');

function render(){
  const term=$('q').value.trim().toLowerCase();
  $('chips').style.display=(tab==='home'&&!term)?'flex':'none';
  let h='';
  if(term){
    const r=games.filter(g=>(g.name+g.cat).toLowerCase().includes(term));
    h='<h2>Resultados</h2>'+(r.length?list(r):'<div class="empty">Nenhum jogo encontrado para esta pesquisa.</div>');
  }else if(tab==='lib'){
    const r=games.filter(g=>inst.has(g.id));
    h=`<h2>Instalados (${r.length})</h2>`+(r.length?list(r):'<div class="empty">Você ainda não instalou nenhum jogo.<br>Toque em Instalar para começar.</div>');
  }else if(cat!=='Para você'){
    h=`<h2>${cat}</h2>`+list(games.filter(g=>g.cat===cat));
  }else{
    const top=[...games].sort((a,b)=>b.rate-a.rate);
    h=`<div class="hero" style="margin-top:4px">${top.slice(0,3).map(hero).join('')}</div>
    <h2>Sugeridos para você</h2><div class="row">${games.map(rc).join('')}</div>
    <h2>Top jogos</h2>${list(top,1)}`;
  }
  $('view').innerHTML=h;
}
$('chips').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');

function snack(m){const s=$('snack');s.textContent=m;s.classList.add('on');clearTimeout(snack.t);snack.t=setTimeout(()=>s.classList.remove('on'),2400)}

function paint(id,p){
  document.querySelectorAll(`.btn[data-id="${id}"]`).forEach(b=>{b.textContent=Math.round(p)+'%';b.style.setProperty('--p',p+'%');b.className='btn prog'+(b.classList.contains('big')?' big':'')});
}
function install(id){
  if(busy[id])return;busy[id]=1;let p=0;
  paint(id,0);
  const t=setInterval(()=>{
    p+=Math.random()*16+6;
    if(p>=100){clearInterval(t);delete busy[id];inst.add(id);save();render();if(cur)detail(cur);snack('Instalado: '+by(id).name)}
    else paint(id,p);
  },200);
}
function act(id){inst.has(id)?openGame(by(id).file):install(id)}

function detail(id){
  cur=id;const g=by(id),p5=Math.round(30+(g.rate-4)*60),rest=100-p5;
  const bars=[p5,rest*.5,rest*.25,rest*.15,rest*.1].map((v,i)=>`<div>${5-i}<i><u style="width:${v}%"></u></i></div>`).join('');
  const shots=[0,1,2].map(i=>`<div class="sh" style="background:linear-gradient(${150+i*40}deg,${g.c[i%2]},${g.c[(i+1)%2]})">${g.icon}<i>${['Menu','Partida','Pontuação'][i]}</i></div>`).join('');
  $('detail').innerHTML=`
  <div class="dh"><button class="back" data-back>←</button></div>
  <div class="dt"><div class="ic" style="${bg(g)}">${g.icon}</div><div><h1>${g.name}</h1><p class="dv">GhostOS Studio</p><p>${g.cat} · Sem anúncios</p></div></div>
  <div class="st"><div><b>${fm(g.rate)} ★</b><span>Avaliação</span></div><div><b>${g.size}</b><span>Tamanho</span></div><div><b>Livre</b><span>Classificação</span></div><div><b>${g.dl}</b><span>Downloads</span></div></div>
  <div class="acts">${btn(g,'big')}${inst.has(id)?`<button class="btn big sec" data-un="${id}">Desinstalar</button>`:''}</div>
  <h2>Capturas de tela</h2><div class="shots">${shots}</div>
  <h2>Sobre este jogo</h2><p class="dsc">${g.desc}</p>
  <h2>Avaliações</h2><div class="rt"><div class="n">${fm(g.rate)}<small>${g.dl.replace('+','')} usuários</small></div><div class="bars">${bars}</div></div>`;
  $('detail').classList.add('open');
}
function openGame(f){$('fr').src=f;$('player').classList.add('on')}
$('cx').onclick=()=>{$('player').classList.remove('on');$('fr').src=''};

document.addEventListener('click',e=>{
  const b=e.target.closest('.btn[data-id]');
  if(b){e.stopPropagation();act(b.dataset.id);return}
  const u=e.target.closest('[data-un]');
  if(u){inst.delete(u.dataset.un);save();render();detail(u.dataset.un);snack('Desinstalado');return}
  if(e.target.closest('[data-back]')){$('detail').classList.remove('open');cur=null;return}
  const o=e.target.closest('[data-open]');
  if(o){document.getElementById('detail').scrollTop=0;detail(o.dataset.open);return}
  const c=e.target.closest('[data-c]');
  if(c){cat=c.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));render();$('view').scrollTop=0;return}
  const t=e.target.closest('.bn button');
  if(t){
    if(t.dataset.t==='search'){$('q').focus();return}
    tab=t.dataset.t;$('q').value='';
    document.querySelectorAll('.bn button').forEach(x=>x.classList.toggle('on',x===t));
    render();$('view').scrollTop=0;
  }
});
$('q').addEventListener('input',render);
render();
</script>
</body>
</html>
